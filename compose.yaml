include:
  - services/search/compose.yaml

services:
  assistant:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY --from=ghcr.io/astral-sh/uv:0.10.12 /uv /bin/uv
        WORKDIR /app
        ENV UV_PYTHON_DOWNLOADS=never
        COPY pyproject.toml uv.lock ./
        COPY src ./src
        COPY services/search/pyproject.toml ./services/search/
        RUN uv sync --locked --no-dev --no-editable
    command: ["/app/.venv/bin/artorias-server", "--factory", "artorias_local_app.bootstrap:create_app", "--host", "0.0.0.0"]
    environment:
      ARTORIAS_DATA: /data
      ARTORIAS_SEARCH_MODE: remote
      ARTORIAS_SEARCH_URL: http://search:8766
      ARTORIAS_SEARCH_TOKEN: ${ARTORIAS_SEARCH_TOKEN:?Set ARTORIAS_SEARCH_TOKEN}
      ARTORIAS_MODEL_PROVIDER:
      ARTORIAS_MODEL:
      DEEPSEEK_API_KEY:
      DEEPSEEK_BASE_URL:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      ANTHROPIC_API_KEY:
      ANTHROPIC_BASE_URL:
    depends_on:
      search:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - assistant-data:/data

volumes:
  assistant-data:
