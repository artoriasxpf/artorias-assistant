[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artorias-search-service"
version = "0.1.0"
description = "Artorias standalone text search service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "jieba==0.42.1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27,<1"]

[project.scripts]
artorias-search = "artorias_search_service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artorias_search_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
